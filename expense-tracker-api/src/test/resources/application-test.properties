
spring.datasource.url=jdbc:h2:mem:expense_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=MONTH,YEAR
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=never


# Test-only security configuration
jwt.secret=expense-tracker-test-only-secret-key-123456789
jwt.expiration=3600000

# Test-only email configuration
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test@example.com
spring.mail.password=
app.mail.from=test@example.com

# Test-only frontend origin
app.frontend.url=http://localhost:5173
