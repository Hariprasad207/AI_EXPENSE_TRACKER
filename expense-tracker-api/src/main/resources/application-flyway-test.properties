# Dedicated disposable database for migration validation
spring.datasource.url=${FLYWAY_TEST_DB_URL}
spring.datasource.username=${FLYWAY_TEST_DB_USERNAME}
spring.datasource.password=${FLYWAY_TEST_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Run Flyway migrations explicitly under this profile
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true

# Verify entities match the migrated schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
management.health.mail.enabled=false

# Safe, non-production settings for migration validation
jwt.secret=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
spring.mail.username=flyway-test@example.invalid
spring.mail.password=not-used
app.mail.from=flyway-test@example.invalid

ai.provider=ollama
ollama.base-url=http://localhost:11434
ollama.model=qwen3:1.7b