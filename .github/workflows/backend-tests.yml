name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Run backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: expense_tracker_concurrency_test
          POSTGRES_USER: expense_test_user
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U expense_test_user -d expense_tracker_concurrency_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: expense-tracker-api

    env:
      PG_TEST_DB_URL: jdbc:postgresql://localhost:15432/expense_tracker_concurrency_test
      PG_TEST_DB_USERNAME: expense_test_user
      PG_TEST_DB_PASSWORD: ci_test_password

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: expense-tracker-api/pom.xml

      - name: Run complete Maven test suite
        run: bash ./mvnw -B test

  backend-image:
    name: Build backend Docker image
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build backend image
        run: docker build --tag expense-tracker-backend:ci ./expense-tracker-api